[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trader"
version = "0.1.0"
description = "Jev Trader: bot de trading de criptomonedas con decisiones rápidas de Claude Haiku 4.5, gestión de riesgo estricta y paper trading por defecto."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leonardo Apollonio" }]
dependencies = [
    "typesafe-sdk>=0.7.2,<0.8",
    "anthropic>=1.8,<2",
    "ccxt>=4.5,<5",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools.packages.find]
include = ["jev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
